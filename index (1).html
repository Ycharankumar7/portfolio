<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Charan Kumar – Portfolio</title>
<style>
:root{--bg:#0a1114;--card:rgba(20,32,38,.72);--text:#eef2f1;--muted:#8fa3a8;--accent:#ff8a3d;--accent2:#2ec4b6;--line:rgba(255,255,255,.09);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(900px 500px at 85% -10%,rgba(46,196,182,.22),transparent 60%),radial-gradient(800px 500px at -10% 10%,rgba(255,138,61,.18),transparent 60%),var(--bg);background-attachment:fixed;color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.6}
.wrap{max-width:860px;margin:0 auto;padding:24px 20px 64px}
.hero{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.avatar{width:140px;height:140px;border-radius:50%;object-fit:cover;border:3px solid var(--accent);box-shadow:0 0 0 6px rgba(46,196,182,.15),0 0 50px rgba(255,138,61,.4)}
header h1{margin:0;font-size:2.2rem;background:linear-gradient(90deg,#fff,var(--accent) 60%,#ff5e62);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{border-left:4px solid var(--accent2);padding-left:12px}
.tag{border-color:rgba(46,196,182,.4);color:var(--accent2)}
.photo{width:100%;border-radius:12px;border:1px solid var(--line);display:block;margin-top:12px}
.cap{color:var(--muted);font-size:.9rem;margin-top:6px}
header p{margin:4px 0 0;color:var(--muted)}
nav{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0;padding-bottom:16px;border-bottom:1px solid var(--line)}
nav button{font:inherit;padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer}
nav button.on{background:linear-gradient(90deg,var(--accent),#ff5e62);border-color:transparent;color:#1a0e06;font-weight:600}
nav button:hover{border-color:var(--accent2)}
h2{margin-top:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.card{background:var(--card);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:12px;padding:18px;text-align:left;color:var(--text);font:inherit}
button.card{cursor:pointer;transition:transform .15s}
button.card:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:0 10px 30px rgba(255,138,61,.15)}
.card h3{margin:0 0 6px}
.muted{color:var(--muted)}
.tag{display:inline-block;font-size:.8rem;padding:2px 10px;margin:4px 6px 0 0;border-radius:999px;background:var(--bg);border:1px solid var(--line)}
.back{font:inherit;background:none;border:none;color:var(--accent);cursor:pointer;padding:0;margin-bottom:12px}
a{color:var(--accent)}
ul{padding-left:20px}
.item{margin-bottom:16px}
</style>
</head>
<body>
<div class="wrap">
<header class="hero"><img class="avatar" id="avatar" alt="Profile photo"><div><h1 id="name"></h1><p id="title"></p></div></header>
<nav id="nav"></nav>
<main id="view"></main>
</div>

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tags = a => a.map(t => `<span class="tag">${esc(t)}</span>`).join("");
const links = a => a.map(l => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join(" · ");
const tabs = ["About","Projects","Education","Skills","Experience","Certifications","Leadership","Gallery","Contact"];
let tab = "About";

const views = {
  About: () => `<h2>About me</h2><p>${esc(DATA.about)}</p>`,
  Projects: () => `<h2>Projects</h2><div class="grid">${DATA.projects.map((p,i)=>`<button class="card" data-p="${i}"><h3>${esc(p.name)}</h3><div class="muted">${esc(p.summary)}</div>${tags(p.tech)}</button>`).join("")}</div>`,
  Education: () => `<h2>Education</h2>${DATA.education.map(e=>`<div class="card item"><h3>${esc(e.school)}</h3><div>${esc(e.degree)}</div><div class="muted">${esc(e.years)}</div><p>${esc(e.details)}</p></div>`).join("")}<h3>Relevant coursework</h3><div>${tags(DATA.coursework)}</div>`,
  Skills: () => `<h2>Skills</h2>${Object.entries(DATA.skills).map(([k,v])=>`<div class="item"><strong>${esc(k)}</strong><div>${tags(v)}</div></div>`).join("")}`,
  Experience: () => `<h2>Experience</h2>${DATA.experience.map(x=>`<div class="card item"><h3>${esc(x.role)} · ${esc(x.org)}</h3><div class="muted">${esc(x.years)}</div><ul>${x.points.map(p=>`<li>${esc(p)}</li>`).join("")}</ul></div>`).join("")}`,
  Certifications: () => `<h2>Certifications</h2>${DATA.certifications.map(c=>`<div class="card item">${esc(c.text)}${c.img?`<img class="photo" src="${IMG[c.img]}" alt="Certificate">`:""}</div>`).join("")}`,
  Gallery: () => `<h2>Gallery</h2><div class="card"><img class="photo" style="margin-top:0" src="${IMG.lab}" alt="Lab session"><div class="cap">Lab session working with an FPGA development board.</div></div>`,
  Leadership: () => `<h2>Leadership &amp; Responsibilities</h2><ul>${DATA.leadership.map(c=>`<li>${esc(c)}</li>`).join("")}</ul>`,
  Contact: () => `<h2>Contact</h2><p>Email: <a href="mailto:${esc(DATA.contact.email)}">${esc(DATA.contact.email)}</a><br>Phone: ${esc(DATA.contact.phone)}</p><p>${links(DATA.contact.links)}</p>`
};

function projectDetail(i){
  const p = DATA.projects[i];
  $("view").innerHTML = `<button class="back" id="back">← Back to projects</button>
  <h2>${esc(p.name)}</h2><p>${esc(p.description)}</p>
  <h3>Tech used</h3><div>${tags(p.tech)}</div>
  <h3>Key features</h3><ul>${p.features.map(f=>`<li>${esc(f)}</li>`).join("")}</ul>
  ${p.role?`<h3>My role</h3><p>${esc(p.role)}</p>`:""}
  <h3>Links</h3><p>${links(p.links)}</p>`;
  $("back").onclick = () => render();
}

function render(){
  $("nav").innerHTML = tabs.map(t=>`<button class="${t===tab?'on':''}" data-t="${t}">${t}</button>`).join("");
  $("view").innerHTML = views[tab]();
  $("nav").querySelectorAll("button").forEach(b => b.onclick = () => { tab = b.dataset.t; render(); });
  $("view").querySelectorAll("[data-p]").forEach(b => b.onclick = () => projectDetail(+b.dataset.p));
}
$("avatar").src = IMG.profile;
$("name").textContent = DATA.name;
$("title").textContent = DATA.title;
document.title = DATA.name + " – Portfolio";
render();
</script>
